services:
  egress-proxy:
    build:
      context: ./docker/egress-proxy
    networks:
      agent_net:
      detector_net:
      detector_llamafirewall_net:
      default:
    expose:
      - "3128"

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    depends_on:
      - egress-proxy
    environment:
      OPENROUTER_API_KEY: ${AGENT_OPENROUTER_API_KEY}
      HTTPS_PROXY: http://egress-proxy:3128
      AGENT_MODEL: ${AGENT_MODEL}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      agent_net:

  detector:
    build:
      context: .
      dockerfile: docker/detector/Dockerfile
    depends_on:
      - egress-proxy
    # Niente env_file: qui (a differenza di detector-llamafirewall): il
    # container si aspetta la variabile generica OPENROUTER_API_KEY, mentre
    # il valore vive lato host come DETECTOR_OPENROUTER_API_KEY (in
    # .env.aidr) per restare distinguibile da AGENT_OPENROUTER_API_KEY —
    # env_file: inietterebbe il nome cosi' com'e', senza rinominarlo. La
    # sostituzione ${...} qui sotto fa da rinomina; risolve leggendo .env.aidr
    # solo se quella variabile e' anche esportata nella shell che lancia
    # `docker compose` (run_batch.py lo richiede comunque per l'uso proprio,
    # vedi README) — Compose non carica .env.aidr da solo per la sostituzione.
    environment:
      OPENROUTER_API_KEY: ${DETECTOR_OPENROUTER_API_KEY}
      HTTPS_PROXY: http://egress-proxy:3128
      VENDOR_PROXY_LOG_PATH: /var/log/vendor_proxy.jsonl
      SIFTER_MODEL: ${SIFTER_MODEL}
      INSPECTOR_MODEL: ${INSPECTOR_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      detector_net:

  detector-llamafirewall:
    build:
      context: .
      dockerfile: docker/detector-llamafirewall/Dockerfile
      secrets:
        - hf_token
    depends_on:
      - egress-proxy
    env_file:
      # I1 (final review): long-form + required: false — env_file is resolved
      # at project load time, not at service-selection time, so without this
      # a missing .env.llamafirewall broke `docker compose build`/`up`/`rm`
      # even for `agent`/`detector` (--vendor aidr) alone. `.env.*` is
      # gitignored, so a fresh clone has no such file until --vendor
      # llamafirewall is actually used.
      - path: .env.llamafirewall
        required: false
    environment:
      HTTPS_PROXY: http://egress-proxy:3128
      LLAMAFIREWALL_PROXY_LOG_PATH: /var/log/llamafirewall_proxy.jsonl
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      detector_llamafirewall_net:

networks:
  agent_net:
    internal: true
  detector_net:
    internal: true
  detector_llamafirewall_net:
    internal: true

secrets:
  hf_token:
    environment: HF_TOKEN
